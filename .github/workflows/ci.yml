name: 🔒 MergeGuard – PR Safety Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pull-request-tier:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: 🧪 Unit & integration tests (make check)
        run: make check
      - name: 📊 L1 component evaluation suite (706 cases)
        run: python -m evals.run --layer components --mode replay
      - name: 🔗 L3 graph integration evaluation
        run: python -m evals.run --layer integration --mode replay
      - name: 🛡️ L5 robustness suite (prompt injection, odd inputs)
        run: python -m evals.run --layer robustness --mode replay
      - name: 🤖 L2 security reviewer smoke set
        run: python -m evals.run --layer agent_security --split dev --cases 30 --mode replay
      - name: 🤖 L2 non-security agent smoke set
        run: python -m evals.run --layer agents_other --split dev --cases 30 --mode replay
      - name: 🔄 L4 end-to-end pipeline smoke set
        run: python -m evals.run --layer pipeline --split test --cases 30 --mode replay
      - name: 🚦 Regression gate
        run: python -m evals.run --layer regression --mode replay
      - name: 📈 Baseline comparison
        shell: bash
        run: |
          if [ -f evals/baselines/main.json ]; then
            python -m evals.run gate
          else
            echo "::warning::No committed evaluation baseline yet; running the gate self-test only."
            python -m evals.run gate-self-test
          fi
