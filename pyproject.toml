[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeguard"
version = "0.1.0"
description = "A LangGraph-based PR review and merge gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    "httpx",
    "openai",
    "pyyaml",
    "typer",
    "rich",
    "python-dotenv",
    "streamlit",
    "pandas",
    "plotly",
]

[project.optional-dependencies]
eval = [
    "numpy",
    "bandit",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0.12",
    "numpy",
    "bandit",
]

[project.scripts]
mergeguard = "mergeguard.cli:app"

[tool.setuptools]
package-dir = {"" = "src", "evals" = "evals", "dashboard" = "dashboard"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mergeguard*", "evals*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
markers = ["live: requires external credentials and contacts the configured test service"]
